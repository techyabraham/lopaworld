name: CI

on:
  pull_request:
  push:
    branches: [main, master, 'phase/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    # CI-only placeholders. The job env wins over .env (dotenv does not override existing variables).
    # With the postgres service reachable, `next build` (NODE_ENV=production) applies the Payload
    # migrations to this throwaway database, which also exercises them on every run.
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
      JWT_SECRET: ci-only-not-a-deployment-secret
      COOKIE_SECRET: ci-only-not-a-deployment-secret
      PAYLOAD_SECRET: ci-only-not-a-deployment-secret
      PREVIEW_SECRET: ci-only-not-a-deployment-preview-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - name: Font glyph coverage
        run: |
          python -m pip install --disable-pip-version-check fonttools brotli
          python packages/ui/scripts/check-font-glyphs.py
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit tests (Vitest)
        run: pnpm test
      - run: pnpm tokens:check
      - name: Dependency audit gate (high/critical, expiring allow-list)
        run: pnpm audit:gate
      - name: Playwright design-system tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - run: pnpm build

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full git history with gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose --exit-code 1
